on:
  workflow_dispatch:
    inputs:
      websiteURL:
        description: "What Website Screen ?"
        required: true
        default: "https://taistudio.fr"
      width:
        description: "What Website Width Size ?"
        required: true
        default: "1920"
      height:
        description: "What Website Height Size ?"
        required: true
        default: "1080"
      fullpage:
        description: "Capture the full page instead of only the viewport"
        required: false
        type: boolean
        default: true
      delay:
        description: "Seconds to wait after page load before capturing (lets animations finish)"
        required: false
        type: number
        default: 5
name: Screen Website
jobs:
  render:
    name: Screen Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
      - run: sudo apt update
      - run: sudo apt upgrade
      - run: npm install
      - run: npm run screen -- --props="$WORKFLOW_INPUT"
        env:
          WORKFLOW_INPUT: ${{ toJson(github.event.inputs) }}
      # archive: false -> le PNG est téléversé tel quel, sans conteneur .zip
      # retention-days: 1 -> l'artefact expire au bout d'un jour
      # (sans "name" : avec archive: false, le nom du fichier devient le nom de l'artefact)
      - uses: actions/upload-artifact@v7
        with:
          path: screen.png
          archive: false
          retention-days: 1
